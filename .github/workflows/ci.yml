name: Check
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build:all
      - run: npm run check:types
      - run: npm test
      - run: npm pack --dry-run
      - run: git diff --exit-code -- dist index.html
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run check:browser -- --browser=${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        run: npm run check:consumer
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            .local/ui-check/${{ matrix.browser }}/
            .local/consumer-check/results.json
          if-no-files-found: ignore
          retention-days: 7
