<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="An open-source interactive ASCII koi pond. Stir the water, feed the koi, and make it your own.">
  <title>Koi Pond</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:transparent}body{color:var(--foreground,#dedfd4);font:13px/1.5 var(--font-sans,system-ui,sans-serif)}
    .scene{position:relative;overflow:hidden;border-radius:var(--radius,12px);background:#000}koi-pond{height:480px}
    .help{position:absolute;left:18px;bottom:12px;margin:0;pointer-events:none;color:#9b9f91;font-size:11px;text-shadow:0 1px 3px #000}
    .toolbar{padding:16px 0 8px;display:grid;gap:16px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}.row:first-child{justify-content:space-between}
    .environments,.actions{display:flex;flex-wrap:wrap;gap:6px}.environments{padding:3px;border:1px solid var(--border,#30352b);border-radius:9px}
    button,select,summary{font:inherit;color:inherit}button,select{min-height:40px;border:1px solid var(--border,#30352b);border-radius:6px;background:var(--card,#11150f);padding:8px 12px}
    button{cursor:pointer;transition:background-color 140ms,transform 140ms cubic-bezier(.23,1,.32,1)}button:hover{background:var(--secondary,#20271b)}button:active{transform:scale(.97)}
    .environments button{border:0;background:transparent;min-height:34px;padding:6px 12px;color:var(--muted-foreground,#a7ad9e)}.environments button[aria-pressed="true"]{background:var(--secondary,#252c20);color:var(--foreground,#f2ead9)}
    label{display:flex;align-items:center;gap:8px;color:var(--muted-foreground,#a7ad9e)}.range{flex:1 1 160px;max-width:250px;min-height:44px}.range span{min-width:36px}.range output{min-width:36px;color:var(--foreground,#dedfd4);font-variant-numeric:tabular-nums}
    input[type=range]{width:100%;min-width:65px;accent-color:#d9946a;cursor:pointer}input[type=checkbox]{width:16px;height:16px;accent-color:#91a975;cursor:pointer}.plants{display:flex;gap:16px}.plants label{min-height:44px;cursor:pointer}
    .footer{display:flex;align-items:center;flex-wrap:wrap;gap:12px;justify-content:space-between;color:var(--muted-foreground,#a7ad9e);font-size:12px;border-top:1px solid var(--border,#30352b);padding-top:12px}.footer p{margin:0}a{color:inherit;text-underline-offset:3px}a:hover{color:var(--foreground,#eee8d8)}
    details{border-top:1px solid var(--border,#30352b);padding-top:12px}summary{width:fit-content;cursor:pointer;min-height:36px;display:list-item;color:var(--muted-foreground,#a7ad9e)}.embed{position:relative;display:grid;gap:10px;margin:6px 0 12px}.embed p{margin:0;color:var(--muted-foreground,#a7ad9e)}pre{margin:0;padding:14px;background:var(--code-background,#0b1009);border:1px solid var(--border,#30352b);border-radius:8px;overflow:auto;color:var(--foreground,#dedfd4);font:12px/1.6 var(--font-mono,ui-monospace,Consolas,monospace)}.embed button{justify-self:start}
    :is(button,input,select,summary,a):focus-visible{outline:2px solid var(--ring,#dfb180);outline-offset:3px}.live{min-height:18px}
    @media(max-width:520px){koi-pond{height:440px}.toolbar{gap:12px}.row{gap:10px 14px}.row:first-child{align-items:flex-start}.actions{width:100%}.actions button{flex:1;min-height:44px}.range{flex-basis:calc(50% - 14px);max-width:none}.environments{width:100%}.environments button{flex:1;min-height:40px}.help{left:12px;right:12px;bottom:10px;max-width:240px}}
    @media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>
<body>
  <main>
    <div class="scene">
      <koi-pond id="pond" environment="midnight" speed="1.35" fish-count="7"></koi-pond>
      <p class="help">Move or drag to stir. Click or tap to feed.</p>
    </div>
    <section class="toolbar" aria-label="Pond controls">
      <div class="row">
        <div class="environments" role="group" aria-label="Environment">
          <button type="button" data-environment="midnight" aria-pressed="true">Midnight</button>
          <button type="button" data-environment="rain" aria-pressed="false">Rain</button>
          <button type="button" data-environment="dusk" aria-pressed="false">Dusk</button>
        </div>
        <div class="actions"><button id="pause" type="button" aria-pressed="false">Pause</button><button id="reset" type="button">Reset</button><button id="snapshot" type="button">Save image</button></div>
      </div>
      <div class="row">
        <label class="range"><span>Speed</span><input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="1.35"><output id="speed-value" for="speed">1.35×</output></label>
        <label class="range"><span>Koi</span><input id="fish" type="range" min="1" max="16" step="1" value="7"><output id="fish-value" for="fish">7</output></label>
        <div class="plants"><label><input id="lilies" type="checkbox" checked>Lily pads</label><label><input id="lotus" type="checkbox" checked>Lotus</label></div>
        <label>Detail<select id="detail"><option value="fine">Fine</option><option value="balanced">Balanced</option></select></label>
      </div>
      <div class="footer"><p id="scene-description">Black still water</p><p><span id="eaten">0</span> fed</p><a href="https://github.com/dhruvil-codes/koi-pond" target="_blank" rel="noopener noreferrer">Koi Pond on GitHub</a></div>
      <details id="embed-panel"><summary>Use this pond in your project</summary><div class="embed"><p>Copy <code>dist/koi-pond.iife.js</code> into your project, then add this:</p><pre><code id="embed-code"></code></pre><button id="copy" type="button">Copy embed</button></div></details>
      <div id="status" class="live" role="status" aria-live="polite"></div>
    </section>
    <noscript>Enable JavaScript to explore the interactive pond.</noscript>
  </main>
  <!-- POND_BUNDLE -->
  <!-- DEMO_SCRIPT -->
</body>
</html>
